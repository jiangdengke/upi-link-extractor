<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>UPI CDK 管理</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <section id="login-view" class="panel login-panel">
      <p class="eyebrow">ADMIN</p>
      <h1>CDK 管理登录</h1>
      <p class="subtitle">使用服务器环境变量配置的管理员密码登录。</p>
      <form id="login-form">
        <label for="admin-password">管理员密码</label>
        <input id="admin-password" type="password" required autocomplete="current-password" />
        <div class="actions">
          <button type="submit">登录</button>
          <a class="admin-link" href="/">返回用户端</a>
        </div>
        <p id="login-message" class="message" role="status"></p>
      </form>
    </section>

    <main id="admin-view" class="admin-shell" hidden>
      <header class="admin-header">
        <div>
          <p class="eyebrow">UPI LINK ADMIN</p>
          <h1>CDK 管理</h1>
        </div>
        <nav>
          <a class="admin-link" href="/">用户前端</a>
          <button id="logout-button" class="secondary" type="button">退出登录</button>
        </nav>
      </header>

      <section class="panel settings-panel">
        <div class="section-title">
          <div>
            <h2>全局提链配置</h2>
            <p class="hint">代理凭证仅管理员可见，所有用户任务统一使用这里保存的配置。</p>
          </div>
          <span id="settings-summary" class="health">加载中…</span>
        </div>
        <form id="settings-form">
          <label for="settings-proxy-pool">India 代理池（每行一个）</label>
          <textarea id="settings-proxy-pool" rows="6" autocomplete="off" spellcheck="false" placeholder="http://user:pass@host:port"></textarea>
          <div class="grid two">
            <div>
              <label for="settings-login-proxy">登录 / Checkout 代理（可选）</label>
              <input id="settings-login-proxy" autocomplete="off" placeholder="http://user:pass@host:port" />
            </div>
            <div>
              <label for="settings-proxy-step">代理起始步骤</label>
              <input id="settings-proxy-step" type="number" min="1" max="6" value="3" />
            </div>
          </div>
          <div class="grid two">
            <div>
              <label for="settings-retries">Approve 重试次数</label>
              <input id="settings-retries" type="number" min="1" max="60" value="30" />
            </div>
            <div>
              <label for="settings-concurrency">Approve 并发</label>
              <input id="settings-concurrency" type="number" min="1" max="20" value="1" />
            </div>
          </div>
          <div class="actions">
            <button type="submit">保存全局配置</button>
            <span id="settings-message" class="message" role="status"></span>
          </div>
        </form>
      </section>

      <section class="panel settings-panel">
        <div class="section-title">
          <div>
            <h2>Foarge 支付配置</h2>
            <p class="hint">支付型 CDK 使用这里保存的 PBK 额度，密钥不会返回用户端。</p>
          </div>
          <span id="foarge-summary" class="health">加载中…</span>
        </div>
        <form id="foarge-form">
          <label for="foarge-cdks">Foarge 一次性 PBK CDK（每行一个）</label>
          <textarea id="foarge-cdks" rows="5" autocomplete="off" spellcheck="false" placeholder="PBK-XXXX-XXXX-XXXX&#10;PBK-YYYY-YYYY-YYYY"></textarea>
          <p id="foarge-masked" class="hint">批量添加后输入框会清空，已用兑换码不会再次分配。</p>
          <div class="actions">
            <button type="submit">添加到码池</button>
            <button id="foarge-check" class="secondary" type="button">检查上游</button>
            <button id="foarge-clear" class="cancel" type="button">清除</button>
            <span id="foarge-message" class="message" role="status"></span>
          </div>
          <div id="foarge-results" class="foarge-results"></div>
        </form>
      </section>

      <div class="admin-grid">
        <section class="panel">
          <h2>生成兑换码</h2>
          <form id="generate-form">
            <div class="grid two">
              <div>
                <label for="cdk-count">生成数量</label>
                <input id="cdk-count" type="number" min="1" max="100" value="1" />
              </div>
              <div>
                <label for="cdk-uses">每码次数</label>
                <input id="cdk-uses" type="number" min="1" max="10000" value="1" />
              </div>
            </div>
            <div class="grid two">
              <div>
                <label for="cdk-days">有效天数</label>
                <input id="cdk-days" type="number" min="0" max="3650" value="30" />
                <p class="hint">填 0 表示永不过期。</p>
              </div>
              <div>
                <label for="cdk-prefix">前缀</label>
                <input id="cdk-prefix" value="UPI" maxlength="12" />
              </div>
            </div>
            <label for="cdk-kind">兑换码类型</label>
            <select id="cdk-kind">
              <option value="extract">仅提链</option>
              <option value="foarge">提链 + Foarge 支付</option>
            </select>
            <label for="cdk-note">备注</label>
            <input id="cdk-note" maxlength="500" placeholder="渠道、客户或批次说明" />
            <div class="actions">
              <button type="submit">生成 CDK</button>
              <span id="generate-message" class="message" role="status"></span>
            </div>
          </form>

          <div id="generated-box" class="generated-box" hidden>
            <label for="generated-codes">本次生成结果</label>
            <textarea id="generated-codes" readonly></textarea>
            <button id="copy-generated" class="secondary" type="button">复制全部</button>
          </div>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>兑换码列表</h2>
            <button id="refresh-cdks" class="secondary" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>CDK</th>
                  <th>类型</th>
                  <th>次数</th>
                  <th>状态</th>
                  <th>过期时间</th>
                  <th>备注</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="cdk-table"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <div id="admin-toast" class="action-toast" hidden role="status"></div>
    <script src="/static/admin.js" defer></script>
  </body>
</html>
