<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>UPI 提链工具</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ACCESS TOKEN NOT PERSISTED</p>
          <h1>UPI 提链工具</h1>
          <p class="subtitle">从已授权 ChatGPT 账号的 Access Token 创建 Stripe UPI 支付长链与二维码。</p>
        </div>
        <div id="health" class="health">服务检测中…</div>
      </header>

      <section class="panel">
        <form id="job-form">
          <div class="cdk-panel">
            <label for="cdk">CDK 兑换码</label>
            <div class="cdk-row">
              <input id="cdk" name="cdk" required autocomplete="off" spellcheck="false" placeholder="UPI-XXXX-XXXX-XXXX" />
              <button id="check-cdk" class="secondary" type="button">检测 / 兑换</button>
            </div>
            <p id="cdk-status" class="hint">请先输入有效的 CDK。</p>
          </div>

          <label for="credential">Access Token / Session JSON</label>
          <textarea
            id="credential"
            name="credential"
            rows="5"
            required
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="粘贴 Access Token，或包含 accessToken 字段的 JSON"
          ></textarea>
          <p class="hint">凭证不会持久化；支付型 CDK 会将 Access Token 与支付长链提交至支付服务用于验单。Session Cookie 不受支持。</p>

          <label for="email">账号邮箱</label>
          <input id="email" name="email" type="email" autocomplete="off" placeholder="Token 无法解析邮箱时必填" />

          <label class="authorization">
            <input id="authorized" name="authorized" type="checkbox" required />
            <span>我确认该账号属于本人或已获明确授权，并同意支付型任务将凭证提交至支付服务用于验单。</span>
          </label>

          <div class="actions">
            <button id="submit-button" type="submit">开始提链</button>
            <span id="form-message" class="message" role="status"></span>
          </div>
        </form>
      </section>

      <section class="jobs-section">
        <div class="section-title">
          <h2>任务</h2>
          <button id="refresh-button" class="secondary" type="button">刷新</button>
        </div>
        <div id="jobs" class="jobs">
          <div class="empty">还没有任务。</div>
        </div>
      </section>
    </main>

    <div id="qr-modal" class="modal" hidden aria-hidden="true">
      <div class="modal-backdrop" data-modal-close></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
        <header class="modal-head">
          <div>
            <h2 id="qr-modal-title">UPI 支付二维码</h2>
            <p id="qr-modal-email" class="job-meta"></p>
          </div>
          <button id="qr-modal-close" class="icon-button" type="button" aria-label="关闭二维码">×</button>
        </header>
        <img id="qr-modal-image" class="qr-large" alt="UPI 支付二维码" />
        <div class="modal-actions">
          <a id="qr-open-new" class="button-link" target="_blank" rel="noopener noreferrer">新窗口打开二维码</a>
          <button id="qr-modal-done" class="secondary" type="button">关闭</button>
        </div>
      </section>
    </div>

    <div id="action-toast" class="action-toast" hidden role="status"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
